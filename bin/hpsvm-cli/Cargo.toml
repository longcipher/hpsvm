[package]
name = "hpsvm-cli"
description = "Command-line fixture tools for hpsvm"
license.workspace = true
version.workspace = true
edition.workspace = true
repository.workspace = true

[[bin]]
name = "hpsvm"
path = "src/main.rs"
doc = false

[features]
default = []
fd-compat = ["hpsvm-fixture-firedancer/json-codec"]
hotpath = ["dep:hotpath"]

[dependencies]
base64.workspace = true
clap = { workspace = true, features = ["derive"] }
hex.workspace = true
hotpath = { workspace = true, optional = true }
hpsvm.workspace = true
hpsvm-fixture = { workspace = true, default-features = false, features = [
    "bin-codec",
    "instruction-fixture",
    "json-codec",
] }
hpsvm-fixture-bench = { workspace = true, default-features = false, features = ["markdown"] }
hpsvm-fixture-firedancer = { workspace = true, default-features = false, optional = true }
serde = { workspace = true, features = ["derive"] }
serde_json.workspace = true
solana-address.workspace = true
solana-sdk-ids.workspace = true
solana-transaction = { workspace = true, features = ["wincode"] }
thiserror.workspace = true
wincode = { workspace = true }

[dev-dependencies]
hpsvm-fd-fixture.workspace = true
solana-account.workspace = true
solana-instruction.workspace = true
solana-keypair.workspace = true
solana-message.workspace = true
solana-sdk-ids.workspace = true
solana-signer.workspace = true
solana-system-interface.workspace = true
solana-transaction.workspace = true

[lints]
workspace = true
