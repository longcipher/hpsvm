[package]
name = "hpsvm-fixture-fuzz"
version = "0.0.0"
publish = false
edition = "2024"

[package.metadata]
cargo-fuzz = true

# This crate is its own workspace root so `cargo fuzz` does not pull the
# SBF-heavy parent workspace into the fuzz build.
[workspace]
members = ["."]

# Being its own workspace root means it needs its own copy of the vendored
# FireDancer codec patch; without this it would resolve the crates.io release,
# which pins `agave-feature-set = "4.3.0"` and cannot coexist with the agave
# 4.5.0-alpha.1 that `hpsvm-fixture` now pulls in. See `vendor/PATCHES.md`.
[patch.crates-io]
mollusk-svm-fuzz-fixture-firedancer = { path = "../../../vendor/mollusk-svm-fuzz-fixture-firedancer" }

[[bin]]
name = "decode_binary_fixture"
path = "fuzz_targets/decode_binary_fixture.rs"
test = false
doc = false
bench = false

[[bin]]
name = "decode_json_fixture"
path = "fuzz_targets/decode_json_fixture.rs"
test = false
doc = false
bench = false

[[bin]]
name = "decode_firedancer_fixture"
path = "fuzz_targets/decode_firedancer_fixture.rs"
test = false
doc = false
bench = false

[[bin]]
name = "binary_fixture_idempotence"
path = "fuzz_targets/binary_fixture_idempotence.rs"
test = false
doc = false
bench = false

[dependencies]
hpsvm-fixture = { path = "..", features = ["bin-codec", "json-codec", "fd-codec"] }
libfuzzer-sys = "0.4"
# The Firedancer adapter exposes only `FiredancerFixture`, so the fuzz target
# needs the protobuf crate directly. This is its own workspace, so the version
# is literal, and it must match the `hpsvm-fixture` dependency it shares proto
# types with - two different majors here would mean two incompatible
# `InstrFixture` types at the boundary.
mollusk-svm-fuzz-fixture-firedancer = "0.16.0"
prost = "0.14"
serde_json = "1"
wincode = "0.6"
