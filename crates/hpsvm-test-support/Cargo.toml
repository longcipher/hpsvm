[package]
name = "hpsvm-test-support"
description = "Shared SBF test-program fixture lookup for hpsvm tests, benches, and doctests"
license.workspace = true
version.workspace = true
edition.workspace = true
repository.workspace = true
# The default search root is a workspace-relative path that only exists
# inside this repository, so publishing the crate would ship a lookup that
# can never find anything. Consumers point `HPSVM_TEST_PROGRAMS_DIR` at
# their own build output instead.
publish = false

[lints]
workspace = true
