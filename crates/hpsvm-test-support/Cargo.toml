[package]
name = "hpsvm-test-support"
description = "Shared SBF test-program fixture lookup for hpsvm tests, benches, and doctests"
license.workspace = true
version.workspace = true
edition.workspace = true
repository.workspace = true
# The crate stays published: it is a dev-dependency of the published `hpsvm`
# and `hpsvm-fixture-bench` crates, so unpublishing it would leave their
# published manifests pointing at a version that never exists. The search
# root is configurable through `HPSVM_TEST_PROGRAMS_DIR`, so a consumer
# that vendors the programs elsewhere can point the lookup at its own
# build output.
publish = true

[lints]
workspace = true
