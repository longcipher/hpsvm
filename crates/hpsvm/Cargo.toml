[package]
name = "hpsvm"
description = "A fast and lightweight Solana VM simulator for testing solana programs"
license.workspace = true
version.workspace = true
edition.workspace = true
repository.workspace = true
readme = "../../README.md"
include = ["src/**/*", "elf/**/*"]

[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]

[package.metadata.cargo-shear]
# `solana-vote-interface` is a normal dependency only to enable its `serde`
# feature for `solana-vote-program`; see the dependency comment below.
ignored = ["solana-short-vec", "solana-vote-interface", "solana-wincode-varint"]
ignored-paths = ["tests/ui/*.rs"]

[features]
# The account overlay is the hottest map in the crate: every transaction
# looks up each of its account keys in it. `hashbrown`'s default hasher
# (foldhash) is markedly cheaper than the standard library's SipHash, which
# measured about 3% of the whole `max_perf` transaction. The feature stays
# selectable so `--no-default-features` keeps the standard-library maps.
default = ["hashbrown"]
internal-test = []
invocation-inspect-callback = []
hashbrown = ["dep:hashbrown"]
# `serde` gates the derives on this crate's public types. The workspace pins
# `solana-message` 6.0 while the agave 4.5 crates pull the 5.1 copy, so the
# agave-side `solana-message/serde` enablement no longer reaches this crate's
# copy: ask for the feature on our own copy.
serde = [
    "solana-message/serde",
    "solana-transaction-context/serde",
    "solana-instruction/serde",
    "solana-transaction-error/serde",
]
precompiles = ["dep:agave-precompiles"]
# `solana-sbpf/tracer` is compile-time as of sbpf 0.26 (it replaced the old
# `Config::enable_register_tracing` runtime flag), and `solana-program-runtime`
# exposes no passthrough for it, so the crate is a direct dependency.
# Without it `InvokeContext::iterate_vm_traces` never yields anything.
register-tracing = [
    "invocation-inspect-callback",
    "dep:hex",
    "dep:sha2",
    "dep:solana-sbpf",
    "dep:serde_json",
]
hotpath = ["dep:hotpath"]
# Allocation profiling on top of `hotpath`; attributes every allocation to the
# calling instrumented function. Implies `hotpath`.
hotpath-alloc = ["hotpath", "hotpath/hotpath-alloc"]
# RPC-backed account source for forking live cluster state.
fork = ["dep:solana-rpc-client", "dep:solana-rpc-client-api"]
# Loader v3 helpers (set_upgrade_authority, deploy_upgradeable_program).
loader = []
# SPL token operation helpers (transfer, mint, ATA, freeze, etc.).
# `spl-token-interface` is always available because helpers.rs relies on it
# for token balance diagnostics.
token = ["dep:spl-associated-token-account-interface", "dep:solana-program-option"]
# SPL token-2022 extensions; implies `token`.
token-2022 = ["token", "dep:spl-token-2022-interface"]

[dependencies]
agave-feature-set.workspace = true
agave-precompiles = { workspace = true, optional = true, features = [
    "agave-unstable-api",
] }
agave-reserved-account-keys = { workspace = true, features = [
    "agave-unstable-api",
] }
auto_impl.workspace = true
hashbrown = { workspace = true, optional = true }
hex = { workspace = true, optional = true }
hotpath = { workspace = true, optional = true, features = ["hotpath"] }
lru.workspace = true
nu-ansi-term.workspace = true
parking_lot.workspace = true
rayon.workspace = true
serde.workspace = true
serde_json = { workspace = true, optional = true }
sha2 = { workspace = true, optional = true }
smallvec.workspace = true
solana-account.workspace = true
solana-address.workspace = true
solana-address-lookup-table-interface = { workspace = true, features = ["wincode", "bytemuck"] }
solana-builtins = { workspace = true, features = ["agave-unstable-api"] }
solana-clock = { workspace = true, features = ["serde"] }
solana-compute-budget.workspace = true
solana-compute-budget-instruction = { workspace = true, features = [
    "agave-unstable-api",
] }
solana-epoch-rewards = { workspace = true, features = ["serde"] }
solana-epoch-schedule = { workspace = true, features = ["serde"] }
solana-feature-gate-interface = { workspace = true, features = ["bincode"] }
solana-fee = { workspace = true, features = ["agave-unstable-api"] }
solana-fee-structure.workspace = true
solana-hash.workspace = true
solana-instruction.workspace = true
solana-instructions-sysvar.workspace = true
solana-keypair.workspace = true
solana-last-restart-slot = { workspace = true, features = ["serde"] }
solana-loader-v3-interface = { workspace = true, features = ["serde", "wincode"] }
solana-loader-v4-interface.workspace = true
solana-message.workspace = true
solana-native-token.workspace = true
# `serde` is required by `solana-nonce-account` 5.0.0: enabling
# `solana-feature-gate-interface/bincode` unifies `solana-account/bincode` into
# the graph, and its inherent `new_data_with_space` shadows the wincode trait
# method there. agave 4.5.0-alpha.4 stopped enabling that feature itself.
solana-nonce = { workspace = true, features = ["serde"] }
solana-nonce-account = { workspace = true, features = ["wincode"] }
solana-precompile-error.workspace = true
solana-program-error.workspace = true
solana-program-option = { workspace = true, optional = true }
solana-program-pack.workspace = true
solana-program-runtime = { workspace = true, features = ["dev-context-only-utils"] }
solana-rent = { workspace = true, features = ["serde"] }
solana-rpc-client = { workspace = true, optional = true }
solana-rpc-client-api = { workspace = true, optional = true }
solana-sbpf = { version = "0.27.0", features = ["tracer"], optional = true }
solana-sdk-ids.workspace = true
solana-sha256-hasher.workspace = true
# Version-pinning deps to prevent wincode 0.6.0 drift (transitive)
solana-short-vec.workspace = true
solana-signature = { workspace = true, features = ["serde"] }
solana-signer.workspace = true
solana-slot-hashes.workspace = true
solana-slot-history.workspace = true
# `sysvar` gives `StakeHistory`; `serde` is required separately because the
# `SysvarCache` reads and writes that account with `bincode`, i.e. through
# `serde`. Upstream stopped deriving it from `sysvar`, so ask for it directly.
solana-stake-interface = { workspace = true, features = ["serde", "sysvar"] }
solana-svm-callback.workspace = true
solana-svm-log-collector.workspace = true
solana-svm-timings.workspace = true
solana-svm-transaction.workspace = true
solana-syscalls.workspace = true
solana-system-interface.workspace = true
solana-system-program.workspace = true
solana-sysvar = { workspace = true, features = ["serde"] }
solana-sysvar-id.workspace = true
solana-transaction = { workspace = true, features = ["verify", "wincode"] }
solana-transaction-context.workspace = true
solana-transaction-error.workspace = true
# `solana-vote-program` 4.5.0-beta.0 calls
# `AccountSharedData::new_data_with_space` with `VoteStateVersions`, which needs
# `serde::Serialize`, but the crate only enables `solana-vote-interface/wincode`.
# Upstream relies on feature unification inside the agave workspace. Enabling
# `serde` here keeps the published crate buildable on its own.
solana-vote-interface = { workspace = true, features = ["serde"] }
solana-wincode-varint.workspace = true
spl-associated-token-account-interface = { workspace = true, optional = true }
spl-token-2022-interface = { workspace = true, optional = true }
spl-token-interface.workspace = true
thiserror.workspace = true
tracing.workspace = true

[dev-dependencies]
criterion.workspace = true
ed25519-dalek.workspace = true
hpsvm-macros.workspace = true
hpsvm-test-support.workspace = true
k256.workspace = true
proptest.workspace = true
serde.workspace = true
solana-clock.workspace = true
solana-compute-budget-interface.workspace = true
solana-config-interface = { workspace = true, features = ["bincode"] }
solana-ed25519-program.workspace = true
solana-keypair.workspace = true
solana-program-option.workspace = true
solana-program-pack.workspace = true
solana-secp256k1-program = { workspace = true, features = ["bincode"] }
solana-signer.workspace = true
solana-stake-interface = { workspace = true, features = ["bincode"] }
solana-vote-interface = { workspace = true, features = ["wincode", "bincode"] }
spl-associated-token-account-interface.workspace = true
spl-token-interface.workspace = true
test-log.workspace = true
trybuild.workspace = true
# `solana-config-interface` exposes its instruction helpers for both `bincode` and
# `wincode`, and `wincode` wins when both features are on. The `fork` feature pulls
# in `solana-account-decoder`, which turns `wincode` on, so config-account tests must
# be able to satisfy either codec.
wincode = { workspace = true, features = ["derive"] }

[lints]
rust.dead_code = "allow"
clippy.allow_attributes = "warn"

[[test]]
name = "fork"
required-features = ["fork"]

[[test]]
name = "precompiles"
required-features = ["precompiles"]

[[test]]
name = "precompile_registry"
required-features = ["precompiles"]

[[test]]
name = "loader"
required-features = ["loader"]

[[test]]
name = "token_account_factories"
required-features = ["token"]

[[test]]
name = "token_freeze"
required-features = ["token"]

[[test]]
name = "token_multisig"
required-features = ["token"]

[[test]]
name = "token_native_mint"
required-features = ["token", "token-2022"]

[[test]]
name = "token_one_owner"
required-features = ["token"]

[[test]]
name = "token_builders"
required-features = ["token"]

[[bench]]
name = "simple_bench"
harness = false

[[bench]]
name = "max_perf"
harness = false

[[bench]]
name = "hashing"
harness = false

[[bench]]
name = "core_interfaces"
harness = false

[[bench]]
name = "program_cache"
harness = false
