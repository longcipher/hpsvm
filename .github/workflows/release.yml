name: Release

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: write

jobs:
  release:
    name: Release
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Install protobuf compiler
        run: sudo apt-get update && sudo apt-get install -y protobuf-compiler

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: Install Rust nightly with components
        uses: dtolnay/rust-toolchain@nightly
        with:
          components: rustfmt, clippy

      - uses: taiki-e/install-action@v2
        with:
          tool: just,cargo-machete,cargo-shear,taplo-cli,typos-cli,rumdl,leptosfmt

      - name: Install cargo-sort and cargo-workspace-inheritance-check
        run: cargo install cargo-sort cargo-workspace-inheritance-check

      - name: Install Solana CLI
        run: |
          sh -c "$(curl -sSfL https://release.anza.xyz/v4.0.0-rc.0/install)"
          echo "$HOME/.local/share/solana/install/active_release/bin" >> $GITHUB_PATH
          export PATH="$GITHUB_PATH:$PATH"

      - name: Build test programs
        run: cd crates/hpsvm/test_programs && cargo build-sbf

      - name: Run CI checks
        run: just ci

      - name: Get version from tag
        id: tag_version
        run: echo "VERSION=${GITHUB_REF#refs/tags/v}" >> "$GITHUB_ENV"

      - name: Check Cargo.toml version
        run: |
          CARGO_VERSION="$(awk '
            $0 == "[workspace.package]" { in_section = 1; next }
            in_section && $1 == "version" {
              gsub(/"/, "", $3)
              print $3
              exit
            }
            in_section && /^\[/ { exit }
          ' Cargo.toml)"

          if [ -z "$CARGO_VERSION" ]; then
            echo "Error: failed to parse workspace.package.version from Cargo.toml"
            exit 1
          fi

          echo "Cargo version: $CARGO_VERSION"
          echo "Tag version: ${{ env.VERSION }}"

          if [ "$CARGO_VERSION" != "${{ env.VERSION }}" ]; then
            echo "Error: Cargo.toml version ($CARGO_VERSION) does not match tag version (${{ env.VERSION }})"
            exit 1
          fi

      - name: Generate Changelog
        uses: orhun/git-cliff-action@v4
        id: git-cliff
        with:
          config: cliff.toml
          args: --verbose --latest --strip header
        env:
          OUTPUT: CHANGELOG.md

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          body: ${{ steps.git-cliff.outputs.content }}
          prerelease: ${{ contains(github.ref, 'alpha') || contains(github.ref, 'beta') }}

      - name: Publish to crates.io
        # Publish every workspace member declared in `[workspace.dependencies]`,
        # in dependency order, with index-propagation retries.
        #
        # The order must account for workspace *dev-dependencies* on publishable
        # crates: `cargo publish --workspace` ignores them and fails with
        # "no matching package named ..." for crates that exist on disk but not
        # yet on the index — the bug that blocked the 0.1.19 release.
        #
        # `--no-verify` skips the packaged-tarball build. Verification would
        # compile hpsvm-fixture-firedancer's `fd-codec` dependency against the
        # agave 4.3 line, which does not build on this toolchain line; the
        # feature is opt-in, so the published crate stays resolvable without it.
        #
        # `hpsvm-fd-fixture` is the FireDancer codec fork that `fd-codec` backs
        # onto (upstream `mollusk-svm-fuzz-fixture-firedancer` pins agave 4.3).
        # It is not a workspace member — its source lives in `vendor/` — so it
        # is published first, outside the guarded member list below, and the
        # retry loop covers index propagation before
        # `hpsvm-fixture-firedancer` needs it.
        run: |
          set -euo pipefail
          publish_one() {
            local name="$1"
            for _ in $(seq 1 30); do
              local out
              set +e
              out="$(cargo publish -p "$name" --registry crates-io --allow-dirty --no-verify 2>&1)"
              local rc=$?
              set -e
              printf '%s\n' "$out" | tail -20
              if [ "$rc" -eq 0 ]; then
                echo "Published $name"
                return 0
              fi
              if echo "$out" | grep -qE "already exists on crates.io index"; then
                echo "$name is already published on crates.io; skipping"
                return 0
              fi
              echo "Publish of $name not yet ready, waiting for index..."
              sleep 15
            done
            echo "ERROR: failed to publish $name after retries"
            return 1
          }

          # The fork is its own package rooted at vendor/hpsvm-fd-fixture, not a
          # workspace member, so publish it from its directory in a subshell.
          (cd vendor/hpsvm-fd-fixture && publish_one hpsvm-fd-fixture)
          sleep 20

          # Dependency order (dev-dependencies included):
          #   hpsvm-macros               no local deps
          #   hpsvm-test-support         no local deps
          #   hpsvm                      dev-deps on the two above
          #   hpsvm-fixture              deps: hpsvm
          #   hpsvm-fixture-bench        deps: hpsvm, hpsvm-fixture
          #   hpsvm-fixture-firedancer   deps: hpsvm-fixture, hpsvm-fd-fixture
          #   hpsvm-inspectors           deps: hpsvm
          #   hpsvm-cli                  deps: hpsvm, hpsvm-fixture, and the two above
          crates=(
            hpsvm-macros
            hpsvm-test-support
            hpsvm
            hpsvm-fixture
            hpsvm-fixture-bench
            hpsvm-fixture-firedancer
            hpsvm-inspectors
            hpsvm-cli
          )

          # Guard against omissions: the list must cover every publishable
          # workspace member. `cargo metadata` reports `publish: null` for
          # publishable crates and `publish: []` for `publish = false`.
          expected="$(cargo metadata --no-deps --format-version 1 \
            | jq -r '.packages[] | select(.publish == null) | .name' | sort)"
          listed="$(printf '%s\n' "${crates[@]}" | sort)"
          if [ "$listed" != "$expected" ]; then
            echo "ERROR: publish list does not match the publishable workspace members" >&2
            echo "--- expected (from cargo metadata) ---" >&2
            echo "$expected" >&2
            echo "--- listed ---" >&2
            echo "$listed" >&2
            exit 1
          fi

          last=$((${#crates[@]} - 1))
          for i in "${!crates[@]}"; do
            publish_one "${crates[$i]}"
            if [ "$i" -lt "$last" ]; then
              sleep 20
            fi
          done
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}