name: Release

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: write

jobs:
  release:
    name: Release
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Install protobuf compiler
        run: sudo apt-get update && sudo apt-get install -y protobuf-compiler

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: Install Rust nightly with components
        uses: dtolnay/rust-toolchain@nightly
        with:
          components: rustfmt, clippy

      - uses: taiki-e/install-action@v2
        with:
          tool: just,cargo-machete,cargo-shear,taplo-cli,typos-cli,rumdl,leptosfmt

      - name: Install cargo-sort and cargo-workspace-inheritance-check
        run: cargo install cargo-sort cargo-workspace-inheritance-check

      - name: Install Solana CLI
        run: |
          sh -c "$(curl -sSfL https://release.anza.xyz/v4.0.0-rc.0/install)"
          echo "$HOME/.local/share/solana/install/active_release/bin" >> $GITHUB_PATH
          export PATH="$GITHUB_PATH:$PATH"

      - name: Build test programs
        run: cd crates/hpsvm/test_programs && cargo build-sbf

      - name: Run CI checks
        run: just ci

      - name: Get version from tag
        id: tag_version
        run: echo "VERSION=${GITHUB_REF#refs/tags/v}" >> "$GITHUB_ENV"

      - name: Check Cargo.toml version
        run: |
          CARGO_VERSION="$(awk '
            $0 == "[workspace.package]" { in_section = 1; next }
            in_section && $1 == "version" {
              gsub(/"/, "", $3)
              print $3
              exit
            }
            in_section && /^\[/ { exit }
          ' Cargo.toml)"

          if [ -z "$CARGO_VERSION" ]; then
            echo "Error: failed to parse workspace.package.version from Cargo.toml"
            exit 1
          fi

          echo "Cargo version: $CARGO_VERSION"
          echo "Tag version: ${{ env.VERSION }}"

          if [ "$CARGO_VERSION" != "${{ env.VERSION }}" ]; then
            echo "Error: Cargo.toml version ($CARGO_VERSION) does not match tag version (${{ env.VERSION }})"
            exit 1
          fi

      - name: Generate Changelog
        uses: orhun/git-cliff-action@v4
        id: git-cliff
        with:
          config: cliff.toml
          args: --verbose --latest --strip header
        env:
          OUTPUT: CHANGELOG.md

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          body: ${{ steps.git-cliff.outputs.content }}
          prerelease: ${{ contains(github.ref, 'alpha') || contains(github.ref, 'beta') }}

      - name: Publish to crates.io
        # Publish in dependency order, with index-propagation retries. `cargo
        # publish --workspace` (the previous recipe) launches preparation in an
        # order that does not account for workspace *dev-dependencies* on
        # publishable crates, leading to "no matching package named ..." failures
        # for crates that exist on disk but not yet on the index — the same bug
        # blocked the 0.1.19 release.
        run: |
          set -euo pipefail
          publish_one() {
            local name="$1"
            for _ in $(seq 1 30); do
              local out
              set +e
              out="$(cargo publish -p "$name" --registry crates-io --allow-dirty --no-verify 2>&1)"
              local rc=$?
              set -e
              printf '%s\n' "$out" | tail -20
              if [ "$rc" -eq 0 ]; then
                echo "Published $name"
                return 0
              fi
              if echo "$out" | grep -qE "already exists on crates.io index"; then
                echo "$name is already published on crates.io; skipping"
                return 0
              fi
              echo "Publish of $name not yet ready, waiting for index..."
              sleep 15
            done
            echo "ERROR: failed to publish $name after retries"
            return 1
          }

          publish_one hpsvm-macros
          publish_one hpsvm-test-support
          sleep 20
          publish_one hpsvm
          sleep 20
          # hpsvm-fixture is skipped here: its optional `fd-codec` transitive
          # dependency on `mollusk-svm-fuzz-fixture-firedancer` cannot be resolved
          # on crates.io (the vendored patch is not published), so publishing
          # would block the release. The crate ships on git checkouts instead.
          publish_one hpsvm-inspectors
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}