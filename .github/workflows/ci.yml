name: CI

on:
  push:
    branches: ["main", "master"]
    tags: ["v*"]
  pull_request:
    branches: ["main", "master"]
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always

jobs:
  ci:
    name: Lint Test Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Install protobuf compiler
        run: sudo apt-get update && sudo apt-get install -y protobuf-compiler

      - uses: dtolnay/rust-toolchain@nightly
        with:
          components: rustfmt, clippy

      - uses: taiki-e/install-action@v2
        with:
          tool: just,cargo-machete,typos-cli,rumdl

      - name: Install cargo-sort, cargo-shear and cargo-workspace-inheritance-check
        run: cargo install cargo-sort cargo-shear cargo-workspace-inheritance-check

      # The SBF test programs are compiled by this toolchain and then executed by
      # the `agave-*` crates the workspace depends on, so the two should track the
      # same release. They cannot yet: `v4.5.0-alpha.1` installs but fails to link
      # the test programs with `undefined symbol: sol_burn_cus`, because
      # `crates/hpsvm/test_programs` still pins `solana-program-entrypoint 3.1.1`
      # and that syscall is not in its link set. Raising the toolchain therefore
      # needs the test-program SDK bumped in the same change.
      - name: Install Solana CLI
        run: |
          sh -c "$(curl -sSfL https://release.anza.xyz/v4.0.0-rc.0/install)"
          echo "$HOME/.local/share/solana/install/active_release/bin" >> $GITHUB_PATH
          export PATH="$GITHUB_PATH:$PATH"

      - name: Build test programs
        run: cd crates/hpsvm/test_programs && cargo build-sbf

      - name: CI
        run: just ci

